[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "site-shot"
version = "0.1.0"
description = "Official Python SDK for the Site-Shot screenshot API — capture website screenshots in a real Chromium browser (full-page, country proxies, ad & cookie-banner removal). Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Site-Shot", email = "support@site-shot.com" }]
maintainers = [{ name = "Site-Shot", email = "support@site-shot.com" }]
keywords = [
    "screenshot",
    "screenshot-api",
    "website-screenshot",
    "site-shot",
    "sdk",
    "api-client",
    "full-page-screenshot",
    "url-to-image",
    "web-capture",
    "web-scraping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.site-shot.com/"
Documentation = "https://www.site-shot.com/#documentation"
"API keys & pricing" = "https://www.site-shot.com/pricing/"
"For AI agents" = "https://www.site-shot.com/ai-agents/"
Repository = "https://github.com/site-shot/site-shot-python"
Issues = "https://github.com/site-shot/site-shot-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/site_shot"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
]

[tool.mypy]
strict = true
# Always check the checked-out source, never a stale installed copy.
mypy_path = "src"
# The tests are checked too: consumer-shaped usage is exactly where the exported
# TypedDict broke, and checking only src/ is why that shipped. Bodies are
# checked everywhere; only the legacy test module is excused from annotating
# every def.
files = ["src/site_shot", "tests"]

[[tool.mypy.overrides]]
module = ["test_client", "tests.test_client"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py39"
